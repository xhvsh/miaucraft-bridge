# MiaucraftBridge config for the PRODUCTION server - TEMPLATE, no real key.
#
# Copy this to deploy/config.yml on the machine that runs the server, paste the
# real service-role-key there, and copy that to
# plugins/MiaucraftBridge/config.yml before starting the server.
#
# deploy/config.yml is gitignored precisely so a pasted key can never be
# committed by accident. Only this .example file is tracked.
#
# The plugin writes its own config.yml with blank values on first boot and then
# shuts itself down; replacing it before starting avoids that dance.

supabase:
  url: "https://qxgpsutkthtuejjrnywg.supabase.co"
  service-role-key: "PASTE_SERVICE_ROLE_KEY_HERE"
  schema: "public"

# Live behavior is fetched from the public GitHub config. Push edits to
# remote-config.json here to reconfigure every running server.
remote:
  url: "https://raw.githubusercontent.com/xhvsh/miaucraft-bridge/main/remote-config.json"
  poll-seconds: 300
  cache-file: "remote-config-last-good.json"

# Local overrides layered on top of the remote config. Empty = remote as-is.
overrides: {}

# Master switch - set false to fully disable all DB traffic.
enabled: true

# Self-updater. Manifest defaults to .../plugin-update.json (derived
# from remote.url), so future plugin fixes are installed with /bridge update.
update:
  enabled: true
  manifest-url: ""
  check-seconds: 90
  auto-apply: false
  relaunch: true
  restart-command: ""